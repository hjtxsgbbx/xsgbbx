name: Continuous Integration

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: TypeScript Check
        run: npx tsc --noEmit
      - name: ESLint Check
        run: npx eslint src/ --max-warnings 100 --cache

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run Unit Tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.cjs --testPathPattern="test/unit" --ci --coverage --coverageThreshold='{"global":{"lines":80}}'
      - name: Coverage Gate Check
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES_PCT=$(cat coverage/coverage-summary.json | python3 -c "import sys,json; print(json.load(sys.stdin)['total']['lines']['pct'])" 2>/dev/null || echo "0")
            echo "Line coverage: ${LINES_PCT}%"
            if (( $(echo "$LINES_PCT < 80" | bc -l) )); then
              echo "::error::Coverage ${LINES_PCT}% is below 80% threshold"
              exit 1
            fi
          fi
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run Integration Tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.cjs --testPathPattern="test/integration" --ci

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run E2E Tests
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.cjs --testPathPattern="test/e2e" --ci

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high || true
      - name: Check for hardcoded secrets
        run: |
          git diff --name-only HEAD~1 HEAD 2>/dev/null | while read file; do
            if [ -f "$file" ]; then
              if grep -qE '(password|api_key|secret|token)\s*[:=]\s*["\x27][^"\x27]{8,}["\x27]' "$file" 2>/dev/null; then
                echo "::warning file=$file::Potential hardcoded secret detected"
              fi
            fi
          done

  regression-check:
    name: Regression Check
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run Full Test Suite
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.cjs --ci --coverage
      - name: Regression Summary
        run: |
          echo "## Regression Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed" >> $GITHUB_STEP_SUMMARY

  branch-protection-check:
    name: Branch Protection Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ "$BRANCH" =~ ^(feature|bugfix|hotfix|release)/.+ ]]; then
            echo "✅ Branch name follows convention: $BRANCH"
          elif [[ "$BRANCH" == "develop" ]]; then
            echo "✅ Develop branch"
          else
            echo "::warning::Branch '$BRANCH' does not follow naming convention (feature|bugfix|hotfix|release/*)"
          fi
      - name: Check commit message convention
        run: |
          git log --format=%s origin/main..HEAD | while read msg; do
            if [[ ! "$msg" =~ ^(feat|fix|chore|docs|style|refactor|test|perf|ci|build)(\(.+\))?:\ .+ ]]; then
              echo "::warning::Non-conventional commit: $msg"
            fi
          done
