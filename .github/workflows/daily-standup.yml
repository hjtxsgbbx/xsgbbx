name: Daily Standup Report

on:
  schedule:
    - cron: "0 2 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-standup
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  generate-standup:
    name: Generate Daily Standup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install tsx
        run: npm install -D tsx
      - name: Generate Standup Report
        run: npx tsx scripts/dev/iteration-report.ts standup
      - name: Generate Burndown Chart
        run: npx tsx scripts/dev/iteration-report.ts burndown
      - name: Generate Sprint Report
        run: npx tsx scripts/dev/sprint-burndown.ts
      - name: Read Notification Data
        id: notification
        run: |
          if [ -f ".github/standups/latest-notification.json" ]; then
            NOTIFICATION=$(cat .github/standups/latest-notification.json)
            echo "data<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTIFICATION" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "data={}" >> $GITHUB_OUTPUT
          fi
      - name: Standup Summary
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "## Daily Standup — ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f ".github/standups/${DATE}.md" ]; then
            cat ".github/standups/${DATE}.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "No standup report generated (no active iteration)" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Commit Standup Reports
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/standups/ docs/iterations/ || true
          git diff --staged --quiet || git commit -m "chore: daily standup report [skip ci]"
          git push || true

  check-iteration-health:
    name: Check Iteration Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate Iteration Health
        run: |
          if [ -f ".agent_1/iterations/index.json" ]; then
            echo "## Iteration Health Check" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            HEALTH=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              if (!data.activeIterationId) {
                JSON.stringify({ status: 'no_active_iteration', alert: 'No active iteration found' });
              } else {
                const iter = data.iterations.find(i => i.id === data.activeIterationId);
                if (!iter) {
                  JSON.stringify({ status: 'error', alert: 'Active iteration not found in data' });
                } else {
                  const totalSP = iter.tasks.reduce((s, t) => s + t.storyPoints, 0);
                  const doneSP = iter.tasks.filter(t => t.status === 'done').reduce((s, t) => s + t.storyPoints, 0);
                  const blocked = iter.tasks.filter(t => t.status === 'blocked').length;
                  const totalDays = Math.ceil((new Date(iter.endDate) - new Date(iter.startDate)) / 86400000);
                  const elapsedDays = Math.ceil((Date.now() - new Date(iter.startDate)) / 86400000);
                  const remainingDays = Math.max(0, totalDays - elapsedDays);
                  const idealPct = Math.min(100, Math.round(elapsedDays / totalDays * 100));
                  const actualPct = totalSP > 0 ? Math.round(doneSP / totalSP * 100) : 0;
                  const behind = idealPct - actualPct;

                  JSON.stringify({
                    status: behind > 15 ? 'critical' : behind > 0 ? 'warning' : 'healthy',
                    iteration: iter.name,
                    phase: iter.currentPhase,
                    progress: actualPct + '%',
                    ideal: idealPct + '%',
                    behind: behind + '%',
                    blocked: blocked,
                    remainingDays: remainingDays,
                    alert: behind > 15 ? 'Sprint significantly behind schedule!' : behind > 0 ? 'Sprint slightly behind ideal pace' : 'Sprint on track'
                  });
                }
              }
            ")

            STATUS=$(echo $HEALTH | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).status")
            ALERT=$(echo $HEALTH | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).alert")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "$HEALTH" | node -p "
              const h = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              Object.entries(h).map(([k,v]) => '| ' + k + ' | ' + v + ' |').join('\n')
            " >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$STATUS" = "critical" ]; then
              echo "🚨 **CRITICAL**: $ALERT" >> $GITHUB_STEP_SUMMARY
              echo "::warning::$ALERT"
            elif [ "$STATUS" = "warning" ]; then
              echo "⚠️ **WARNING**: $ALERT" >> $GITHUB_STEP_SUMMARY
              echo "::warning::$ALERT"
            else
              echo "✅ Sprint is healthy" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "No iteration data found" >> $GITHUB_STEP_SUMMARY
            echo "::warning::No iteration data found - run sprint:init first"
          fi
