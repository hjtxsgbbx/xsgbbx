name: Iteration Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: iteration-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  iteration-validation:
    name: Iteration Quality Gate
    runs-on: ubuntu-latest
    outputs:
      iteration_id: ${{ steps.iteration-info.outputs.iteration_id }}
      iteration_phase: ${{ steps.iteration-info.outputs.iteration_phase }}
      iteration_status: ${{ steps.iteration-info.outputs.iteration_status }}
      mvp_progress: ${{ steps.iteration-info.outputs.mvp_progress }}
      on_track: ${{ steps.iteration-info.outputs.on_track }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Extract Iteration Info
        id: iteration-info
        run: |
          if [ -f ".agent_1/iterations/index.json" ]; then
            ITER_ID=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              data.activeIterationId || 'none'
            ")
            ITER_PHASE=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              if (data.activeIterationId) {
                const iter = data.iterations.find(i => i.id === data.activeIterationId);
                iter ? iter.currentPhase : 'none';
              } else { 'none'; }
            ")
            ITER_STATUS=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              if (data.activeIterationId) {
                const iter = data.iterations.find(i => i.id === data.activeIterationId);
                iter ? iter.status : 'none';
              } else { 'none'; }
            ")
            MVP_PROGRESS=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              if (data.activeIterationId) {
                const iter = data.iterations.find(i => i.id === data.activeIterationId);
                if (iter && iter.mvp) {
                  const mvpTasks = iter.tasks.filter(t => iter.mvp.tasks.includes(t.id));
                  const done = mvpTasks.filter(t => t.status === 'done').length;
                  mvpTasks.length > 0 ? Math.round(done/mvpTasks.length*100) : 0;
                } else { 'N/A'; }
              } else { 'N/A'; }
            ")
            ON_TRACK=$(node -p "
              const data = JSON.parse(require('fs').readFileSync('.agent_1/iterations/index.json','utf8'));
              if (data.activeIterationId) {
                const iter = data.iterations.find(i => i.id === data.activeIterationId);
                if (iter) {
                  const totalSP = iter.tasks.reduce((s, t) => s + t.storyPoints, 0);
                  const doneSP = iter.tasks.filter(t => t.status === 'done').reduce((s, t) => s + t.storyPoints, 0);
                  const totalDays = Math.ceil((new Date(iter.endDate) - new Date(iter.startDate)) / 86400000);
                  const elapsedDays = Math.ceil((Date.now() - new Date(iter.startDate)) / 86400000);
                  const idealPct = Math.min(100, Math.round(elapsedDays / totalDays * 100));
                  const actualPct = totalSP > 0 ? Math.round(doneSP / totalSP * 100) : 0;
                  actualPct >= idealPct ? 'true' : 'false';
                } else { 'unknown'; }
              } else { 'unknown'; }
            ")
            echo "iteration_id=$ITER_ID" >> $GITHUB_OUTPUT
            echo "iteration_phase=$ITER_PHASE" >> $GITHUB_OUTPUT
            echo "iteration_status=$ITER_STATUS" >> $GITHUB_OUTPUT
            echo "mvp_progress=$MVP_PROGRESS" >> $GITHUB_OUTPUT
            echo "on_track=$ON_TRACK" >> $GITHUB_OUTPUT
          else
            echo "iteration_id=none" >> $GITHUB_OUTPUT
            echo "iteration_phase=none" >> $GITHUB_OUTPUT
            echo "iteration_status=none" >> $GITHUB_OUTPUT
            echo "mvp_progress=N/A" >> $GITHUB_OUTPUT
            echo "on_track=unknown" >> $GITHUB_OUTPUT
          fi
      - name: Iteration Gate Summary
        run: |
          echo "## Iteration Gate Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Active Iteration | ${{ steps.iteration-info.outputs.iteration_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Current Phase | ${{ steps.iteration-info.outputs.iteration_phase }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Iteration Status | ${{ steps.iteration-info.outputs.iteration_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MVP Progress | ${{ steps.iteration-info.outputs.mvp_progress }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| On Track | ${{ steps.iteration-info.outputs.on_track }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.iteration-info.outputs.iteration_status }}" = "active" ]; then
            echo "✅ Active iteration detected — PR aligns with current sprint" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.iteration-info.outputs.iteration_id }}" = "none" ]; then
            echo "⚠️ No active iteration — consider starting a new sprint" >> $GITHUB_STEP_SUMMARY
          fi

  type-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  lint-check:
    name: ESLint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx eslint src/ --max-warnings 100

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx jest --config jest.config.cjs --testPathPattern="test/(?!integration|e2e)" --ci --coverage
      - name: Coverage Gate
        run: |
          COVERAGE_FILE="coverage/coverage-summary.json"
          if [ -f "$COVERAGE_FILE" ]; then
            LINES=$(node -p "JSON.parse(require('fs').readFileSync('$COVERAGE_FILE','utf8')).total.lines.pct")
            if [ $(echo "$LINES < 70" | bc -l) -eq 1 ]; then
              echo "::warning::Line coverage ${LINES}% is below 70% threshold"
            fi
          fi

  iteration-gate-result:
    name: Iteration Gate Result
    needs: [iteration-validation, type-check, lint-check, test-suite]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate Result
        run: |
          echo "## Iteration Gate Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Iteration Validation | ${{ needs.iteration-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeScript Check | ${{ needs.type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ESLint Check | ${{ needs.lint-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | ${{ needs.test-suite.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Iteration Context | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Iteration ID | ${{ needs.iteration-validation.outputs.iteration_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | ${{ needs.iteration-validation.outputs.iteration_phase }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MVP Progress | ${{ needs.iteration-validation.outputs.mvp_progress }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| On Track | ${{ needs.iteration-validation.outputs.on_track }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.type-check.result }}" = "failure" ] || [ "${{ needs.test-suite.result }}" = "failure" ]; then
            echo "❌ **Iteration gate FAILED** — blocking merge" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Iteration gate PASSED** — merge allowed" >> $GITHUB_STEP_SUMMARY
          fi
