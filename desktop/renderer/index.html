<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;" />
  <title>agent_1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deepest: #080c16;
      --bg-primary: #0d1224;
      --bg-secondary: #131a30;
      --bg-card: #182140;
      --bg-elevated: #1e2a4e;
      --bg-input: #0f1629;
      --bg-sidebar: #0b1020;
      --text-primary: #e2e7f0;
      --text-secondary: #8893aa;
      --text-muted: #556078;
      --accent-cyan: #06d6f0;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --accent-orange: #f97316;
      --border-default: #243050;
      --border-subtle: #1c2a44;
      --gradient-accent: linear-gradient(135deg, #06d6f0, #3b82f6);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.5);
      --radius-sm: 5px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
      --font-sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    html, body, #root {
      height: 100%;
      overflow: hidden;
      font-family: var(--font-sans);
      background: var(--bg-deepest);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #354468; }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-deepest);
      background-image:
        radial-gradient(ellipse at 30% 0%, rgba(6,214,240,0.02) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(139,92,246,0.02) 0%, transparent 40%);
    }

    .app-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      display: flex;
      flex-direction: column;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .sidebar-logo {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 800;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-logo-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
      flex-shrink: 0;
    }

    .sidebar-section-label {
      padding: 10px 14px 4px;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-family: var(--font-sans);
    }

    .sidebar-files {
      flex: 1;
      overflow: auto;
      padding: 2px 0;
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-split {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .content-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-header {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: var(--bg-primary);
    }

    .panel-header-icon { font-size: 12px; }
    .panel-body { flex: 1; overflow: auto; }

    .editor-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg-primary);
    }

    .editor-header {
      padding: 6px 14px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .editor-content {
      flex: 1;
      margin: 0;
      padding: 14px 18px;
      overflow: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .editor-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }

    .editor-empty-icon { font-size: 36px; opacity: 0.3; }

    .tree-node { user-select: none; transition: background 0.12s; }
    .tree-node:hover { background: rgba(6,214,240,0.04); }

    .tree-node-file {
      padding: 3px 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.12s;
    }

    .tree-node-file:hover { color: var(--text-primary); }

    .tree-node-file.selected {
      background: rgba(6,214,240,0.1);
      color: var(--accent-cyan);
      border-right: 2px solid var(--accent-cyan);
    }

    .tree-node-folder {
      padding: 3px 8px;
      cursor: pointer;
      color: #e2b714;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.12s;
    }

    .tree-node-folder:hover { background: rgba(226,183,20,0.06); }
    .tree-icon { flex-shrink: 0; font-size: 11px; }

    .tree-arrow {
      width: 14px;
      text-align: center;
      flex-shrink: 0;
      font-size: 10px;
      transition: transform 0.15s;
    }

    .tree-arrow.expanded { transform: rotate(90deg); }
    .tree-empty { padding: 20px; color: var(--text-muted); font-size: 13px; text-align: center; }

    .chat-container { display: flex; flex-direction: column; height: 100%; flex: 1; }
    .chat-messages { flex: 1; overflow: auto; padding: 8px 0; }

    .chat-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
      flex-direction: column;
      gap: 8px;
    }

    .chat-empty-icon { font-size: 32px; opacity: 0.25; }

    .chat-message {
      display: flex;
      padding: 8px 16px;
      gap: 12px;
      animation: chatMsgIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes chatMsgIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message.user { flex-direction: row-reverse; }

    .chat-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .chat-avatar.user { background: var(--gradient-accent); }
    .chat-avatar.assistant { background: linear-gradient(135deg, #06d6f0, #8b5cf6); }

    .chat-bubble {
      max-width: 70%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.5;
      font-family: var(--font-sans);
      word-break: break-word;
      box-shadow: var(--shadow-sm);
    }

    .chat-bubble.user {
      background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
      border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md);
      border-color: rgba(59,130,246,0.2);
    }

    .chat-bubble.assistant {
      border-radius: var(--radius-md) var(--radius-md) var(--radius-md) 4px;
    }

    .chat-time { font-size: 9px; color: var(--text-muted); }

    .msg-copy-btn {
      background: transparent;
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-sans);
      font-weight: 600;
    }

    .msg-copy-btn:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }
    .msg-copy-btn.copied { color: var(--accent-green); border-color: var(--accent-green); }

    .chat-bubble .message-content h2 { font-size: 16px; font-weight: 700; margin: 8px 0 4px; }
    .chat-bubble .message-content h3 { font-size: 14px; font-weight: 700; margin: 6px 0 3px; }
    .chat-bubble .message-content h4 { font-size: 13px; font-weight: 700; margin: 4px 0 2px; }
    .chat-bubble .message-content p { margin: 3px 0; }
    .chat-bubble .message-content ul { margin: 3px 0; padding-left: 18px; }
    .chat-bubble .message-content ol { margin: 3px 0; padding-left: 22px; }
    .chat-bubble .message-content li { margin: 1px 0; }
    .chat-bubble .message-content li::marker { color: var(--text-muted); }
    .chat-bubble .message-content blockquote {
      border-left: 3px solid var(--accent-cyan);
      padding: 3px 10px;
      margin: 6px 0;
      background: rgba(6,214,240,0.04);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-secondary);
      font-style: italic;
    }
    .chat-bubble .message-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 6px 0;
      font-size: 11px;
    }
    .chat-bubble .message-content th, .chat-bubble .message-content td {
      border: 1px solid var(--border-default);
      padding: 4px 8px;
      text-align: left;
    }
    .chat-bubble .message-content th {
      background: var(--bg-elevated);
      font-weight: 700;
      color: var(--text-primary);
    }
    .chat-bubble .message-content td {
      color: var(--text-secondary);
    }
    .chat-bubble .message-content hr {
      border: none;
      border-top: 1px solid var(--border-default);
      margin: 8px 0;
    }
    .chat-bubble .message-content pre {
      background: var(--bg-deepest);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      margin: 6px 0;
      border: 1px solid var(--border-subtle);
      position: relative;
    }
    .chat-bubble .message-content pre::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-accent);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      opacity: 0.5;
    }
    .chat-bubble .message-content code {
      background: var(--bg-deepest);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #ec4899;
    }
    .chat-bubble .message-content pre code {
      background: none;
      padding: 0;
      color: var(--text-primary);
    }
    .chat-bubble .message-content strong { font-weight: 700; color: var(--text-primary); }
    .chat-bubble .message-content em { font-style: italic; }
    .chat-user .chat-time { text-align: right; }

    .chat-thinking {
      padding: 4px 16px;
      font-size: 12px;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      background: rgba(6,214,240,0.03);
    }

    .chat-thinking-dots { display: flex; gap: 3px; }
    .chat-thinking-dots span {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent-cyan);
      animation: dotBounce 1.4s ease-in-out infinite;
    }
    .chat-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
    .chat-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.4); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    .chat-input-area {
      padding: 8px 16px 12px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-secondary);
    }

    .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }

    .chat-input {
      flex: 1;
      padding: 8px 14px;
      font-size: 13px;
      font-family: var(--font-sans);
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      resize: none;
      outline: none;
      line-height: 1.5;
      min-height: 38px;
      max-height: 100px;
      transition: all 0.2s ease;
    }

    .chat-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 2px rgba(6,214,240,0.1);
    }

    .chat-input::placeholder { color: var(--text-muted); }

    .chat-input.interrupt {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 2px rgba(245,158,11,0.1);
    }

    .btn-send {
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      white-space: nowrap;
      font-family: var(--font-sans);
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    .btn-send.active {
      background: var(--gradient-accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(6,214,240,0.25);
    }

    .btn-send.active:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(6,214,240,0.35);
    }

    .btn-send.inactive {
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: default;
      opacity: 0.5;
    }

    .btn-abort-sm {
      margin-left: auto;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      background: transparent;
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-sans);
    }

    .btn-abort-sm:hover {
      background: rgba(239,68,68,0.1);
      box-shadow: 0 0 12px rgba(239,68,68,0.15);
    }

    .terminal-container {
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-deepest);
      overflow: hidden;
      transition: max-height 0.2s;
    }

    .terminal-header {
      padding: 4px 14px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      transition: background 0.12s;
    }

    .terminal-header:hover { background: rgba(255,255,255,0.02); }

    .terminal-body {
      padding: 8px 14px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      max-height: 170px;
      overflow-y: auto;
    }

    .terminal-empty { color: var(--text-muted); }

    .statusbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-primary);
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      height: 28px;
      flex-shrink: 0;
    }

    .statusbar-left { display: flex; gap: 16px; align-items: center; }
    .statusbar-right { display: flex; gap: 16px; align-items: center; }

    .statusbar-mode {
      font-weight: 700;
      padding: 1px 8px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .statusbar-mode.default { color: var(--text-muted); }
    .statusbar-mode.plan { color: #a78bfa; background: rgba(139,92,246,0.1); }
    .statusbar-mode.act { color: var(--accent-green); background: rgba(16,185,129,0.1); }

    .statusbar-agent { display: flex; align-items: center; gap: 5px; }
    .statusbar-agent-dot { width: 6px; height: 6px; border-radius: 50%; }
    .statusbar-agent-dot.idle { background: var(--text-muted); }
    .statusbar-agent-dot.thinking { background: #a78bfa; box-shadow: 0 0 6px #a78bfa; animation: dotPulse 1s infinite; }
    .statusbar-agent-dot.observing { background: #3b82f6; }
    .statusbar-agent-dot.reflecting { background: var(--accent-orange); }
    .statusbar-agent-dot.acting { background: var(--accent-green); box-shadow: 0 0 6px rgba(16,185,129,0.5); }

    @keyframes dotPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(6,214,240,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.04) 0%, transparent 50%),
        var(--bg-deepest);
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 40px;
    }

    .welcome-card {
      border: 1px solid var(--border-default);
      border-radius: 20px;
      padding: 56px 72px;
      text-align: center;
      background: linear-gradient(160deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      box-shadow: var(--shadow-lg), 0 0 60px rgba(6,214,240,0.03);
      max-width: 560px;
      width: 100%;
    }

    .welcome-logo {
      font-size: 52px;
      font-weight: 900;
      margin-bottom: 8px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 2px;
      font-family: var(--font-mono);
    }

    .welcome-subtitle {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      font-weight: 500;
    }

    .welcome-desc {
      color: var(--text-muted);
      max-width: 400px;
      text-align: center;
      line-height: 1.6;
      margin-bottom: 36px;
      margin-left: auto;
      margin-right: auto;
      font-size: 14px;
    }

    .welcome-steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 36px;
      width: 100%;
    }

    .welcome-step {
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 10px;
      text-align: center;
      background: var(--bg-card);
      transition: all 0.2s;
    }

    .welcome-step:hover {
      border-color: rgba(6,214,240,0.3);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .welcome-step-icon { font-size: 26px; margin-bottom: 6px; }
    .welcome-step-label { font-size: 12px; font-weight: 700; color: var(--text-primary); }
    .welcome-step-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .btn-get-started {
      padding: 14px 52px;
      font-size: 15px;
      font-weight: 800;
      background: var(--gradient-accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: var(--font-sans);
      letter-spacing: 0.3px;
      box-shadow: 0 4px 16px rgba(6,214,240,0.25);
    }

    .btn-get-started:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(6,214,240,0.4);
    }

    .btn-get-started:active { transform: translateY(0); }
    .btn-get-started:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }

    .welcome-footer {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 24px;
      font-family: var(--font-mono);
    }

    .permission-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(5,8,16,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .permission-dialog {
      background: var(--bg-secondary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      padding: 24px;
      max-width: 480px;
      width: 90%;
      color: var(--text-primary);
      font-family: var(--font-sans);
      box-shadow: var(--shadow-lg);
    }

    .permission-dialog h3 { color: var(--accent-yellow); margin-bottom: 12px; font-size: 16px; font-weight: 700; }
    .permission-dialog p { color: var(--text-secondary); font-size: 13px; margin-bottom: 6px; line-height: 1.5; }
    .permission-tool { color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }

    .permission-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    .btn-permission {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
      font-family: var(--font-sans);
    }

    .btn-permission-reason {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-default);
      margin-right: auto;
    }

    .btn-permission-reason:hover { border-color: var(--text-secondary); color: var(--text-secondary); }

    .btn-permission-deny { background: rgba(239,68,68,0.08); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.3); }
    .btn-permission-deny:hover { background: rgba(239,68,68,0.15); }
    .btn-permission-allow { background: rgba(16,185,129,0.08); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.3); }
    .btn-permission-allow:hover { background: rgba(16,185,129,0.15); }
    .btn-permission-always { background: rgba(139,92,246,0.08); color: var(--accent-purple); border: 1px solid rgba(139,92,246,0.3); }
    .btn-permission-always:hover { background: rgba(139,92,246,0.15); }

    .permission-reason-input {
      width: 100%;
      padding: 8px 12px;
      margin-top: 12px;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-family: var(--font-mono);
      outline: none;
      transition: border-color 0.15s;
    }

    .permission-reason-input:focus { border-color: var(--accent-cyan); }

    .error-boundary {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--bg-deepest);
      color: var(--text-primary);
      font-family: var(--font-mono);
      padding: 40px;
    }

    .error-boundary h2 { color: var(--accent-red); margin-bottom: 12px; }
    .error-boundary pre { color: var(--text-muted); max-width: 600px; white-space: pre-wrap; margin: 12px 0; font-size: 12px; }

    .btn-retry {
      margin-top: 16px;
      padding: 10px 24px;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }

    .btn-retry:hover { background: var(--bg-elevated); border-color: var(--text-secondary); }

    /* ==================== 方案B: Modern Studio 主题 ==================== */
    [data-theme="studio"] {
      --bg-deepest: #0d1117;
      --bg-primary: #131820;
      --bg-secondary: #19212c;
      --bg-card: #1e2836;
      --bg-elevated: #253040;
      --bg-input: #0f151c;
      --bg-sidebar: #0c1218;
      --text-primary: #e6edf3;
      --text-secondary: #8d9aac;
      --text-muted: #596774;
      --accent-cyan: #f0883e;
      --accent-blue: #f5a623;
      --accent-purple: #e05a2b;
      --accent-green: #3fb950;
      --accent-red: #f85149;
      --accent-yellow: #f7b731;
      --accent-orange: #f97316;
      --border-default: #2a3545;
      --border-subtle: #1f2937;
      --gradient-accent: linear-gradient(135deg, #f0883e, #f5a623);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.35);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.45);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.55);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
      --font-sans: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    [data-theme="studio"] .app-container {
      background:
        radial-gradient(ellipse at 30% 0%, rgba(240,136,62,0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(224,90,42,0.03) 0%, transparent 40%);
    }

    [data-theme="studio"] .sidebar-logo {
      background: none;
      -webkit-text-fill-color: var(--accent-cyan);
    }

    [data-theme="studio"] .sidebar-logo-dot {
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    [data-theme="studio"] .welcome-logo {
      background: none;
      -webkit-text-fill-color: var(--accent-cyan);
    }

    [data-theme="studio"] .btn-get-started {
      box-shadow: 0 4px 16px rgba(240,136,62,0.3);
    }

    [data-theme="studio"] .btn-get-started:hover {
      box-shadow: 0 6px 24px rgba(240,136,62,0.45);
    }

    [data-theme="studio"] .tree-node-file.selected {
      background: rgba(240,136,62,0.1);
      color: var(--accent-cyan);
      border-right: 2px solid var(--accent-cyan);
    }

    [data-theme="studio"] .tree-node:hover {
      background: rgba(240,136,62,0.04);
    }

    [data-theme="studio"] .chat-input:focus {
      box-shadow: 0 0 0 2px rgba(240,136,62,0.1);
    }

    [data-theme="studio"] .chat-input.interrupt {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 0 2px rgba(247,183,49,0.1);
    }

    [data-theme="studio"] .btn-send.active {
      box-shadow: 0 2px 8px rgba(240,136,62,0.3);
    }

    [data-theme="studio"] .btn-send.active:hover {
      box-shadow: 0 4px 14px rgba(240,136,62,0.4);
    }

    [data-theme="studio"] .chat-thinking {
      background: rgba(240,136,62,0.04);
    }

    [data-theme="studio"] .chat-thinking-dots span {
      background: var(--accent-cyan);
    }

    [data-theme="studio"] .welcome-step:hover {
      border-color: rgba(240,136,62,0.3);
    }

    [data-theme="studio"] .permission-reason-input:focus {
      border-color: var(--accent-cyan);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-default);
      color: var(--text-muted);
      font-size: 10px;
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-sans);
      font-weight: 600;
      white-space: nowrap;
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(6,214,240,0.06);
    }

    [data-theme="studio"] .theme-toggle-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--accent-cyan);
      background: rgba(240,136,62,0.08);
    }

    .terminal-line {
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      line-height: 1.5;
      border-left: 2px solid transparent;
    }

    .terminal-tool {
      color: var(--accent-cyan);
      border-left-color: var(--accent-cyan);
    }

    .terminal-result {
      color: var(--accent-green);
      border-left-color: var(--accent-green);
    }

    .terminal-error {
      color: var(--accent-red);
      border-left-color: var(--accent-red);
    }

    .terminal-info {
      color: var(--text-secondary);
      border-left-color: var(--text-muted);
    }

    .streaming-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent-cyan);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: cursorBlink 1s step-end infinite;
    }

    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    *:focus-visible {
      outline: 2px solid var(--accent-cyan);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
